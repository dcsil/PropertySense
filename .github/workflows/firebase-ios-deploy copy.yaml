name: Build and distribute

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./object_detect_test
    steps:
      - uses: actions/checkout@v2

      - uses: cedvdb/action-flutter-build-ios@v1
        with:
          working-directory: ./object_detect_test
          # always use --export-options-plist=ios/GithubActionsExportOptions.plist
          build-cmd: flutter build ipa --release --export-options-plist=ios/GithubActionsExportOptions.plist
          certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          keychain-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstore-release-ipa-latest
          path: object_detect_test/build/ios/ipa/PropertySense/ipa
          retention-days: 30

      - name: Upload to App Store Connect using altool
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey $API_KEY_ID \
            --apiIssuer $API_ISSUER_ID

      - name: Wait for Processing (Optional)
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          echo "Build uploaded! Check App Store Connect for processing status."
          echo "You can monitor at: https://appstoreconnect.apple.com"
